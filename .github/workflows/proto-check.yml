name: proto-check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  proto-check:
    name: Proto check
    runs-on: macos-15
    # Prevent duplicate builds on internal PRs, as the test job in ci.yml does.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      # The generator pin (see Makefile): protoc 34.0 and protoc-gen-swift built
      # from swift-protobuf tag 1.35.0, which resolves to commit 9bbb079b. Both are
      # fixed here, not left to the runner. The protoc zip is checked against the
      # SHA-256 of the GitHub release asset.
      - name: Install protoc 34.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v34.0/protoc-34.0-osx-universal_binary.zip
          echo "380b67ad730a7c8c3aea2f8eca7c6b14f492ae757eb94107be45d3bb297d9fcc  $RUNNER_TEMP/protoc.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: Restore protoc-gen-swift
        id: plugin-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tools/bin
          key: protoc-gen-swift-1.35.0-9bbb079b69af9d66470ced85461bf13bb40becac-${{ runner.os }}-${{ runner.arch }}
      - name: Build protoc-gen-swift from swift-protobuf 1.35.0
        if: steps.plugin-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 1.35.0 --recurse-submodules --shallow-submodules https://github.com/apple/swift-protobuf.git "$RUNNER_TEMP/swift-protobuf"
          test "$(git -C "$RUNNER_TEMP/swift-protobuf" rev-parse HEAD)" = "9bbb079b69af9d66470ced85461bf13bb40becac"
          (cd "$RUNNER_TEMP/swift-protobuf" && swift build -c release --product protoc-gen-swift)
          mkdir -p "$RUNNER_TEMP/tools/bin"
          cp "$RUNNER_TEMP/swift-protobuf/.build/release/protoc-gen-swift" "$RUNNER_TEMP/tools/bin/"
      - name: Add protoc-gen-swift to PATH
        run: echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Regenerate client.pb.swift
        run: make proto
      - name: Fail on diff
        run: git diff --exit-code -- Sources/SwiftCentrifuge/client.pb.swift
