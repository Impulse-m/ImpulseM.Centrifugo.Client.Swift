name: proto-check
on:
  push:
    paths:
      - client.proto
      - tools.env
      - Makefile
      - Sources/SwiftCentrifuge/client.pb.swift
      - .github/workflows/proto-check.yml
  pull_request:
    paths:
      - client.proto
      - tools.env
      - Makefile
      - Sources/SwiftCentrifuge/client.pb.swift
      - .github/workflows/proto-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proto-check:
    name: Proto check
    runs-on: macos-15
    # Prevent duplicate builds on internal PRs, as the test job in ci.yml does.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      # The pins live in tools.env (see Makefile and docs/protocol-sync.md).
      - name: Load pins
        run: grep -E '^[A-Z0-9_]+=' tools.env >> "$GITHUB_ENV"
      # The protoc 34.0 zip is checked against the SHA-256 of the release asset.
      - name: Install protoc
        run: |
          curl -sSL -o "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-osx-universal_binary.zip"
          echo "$PROTOC_SHA256  $RUNNER_TEMP/protoc.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: Restore protoc-gen-swift
        id: plugin-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tools/bin
          key: protoc-gen-swift-${{ env.SWIFT_PROTOBUF_TAG }}-${{ env.SWIFT_PROTOBUF_COMMIT }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build protoc-gen-swift from swift-protobuf
        if: steps.plugin-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SWIFT_PROTOBUF_TAG" --recurse-submodules --shallow-submodules https://github.com/apple/swift-protobuf.git "$RUNNER_TEMP/swift-protobuf"
          test "$(git -C "$RUNNER_TEMP/swift-protobuf" rev-parse HEAD)" = "$SWIFT_PROTOBUF_COMMIT"
          (cd "$RUNNER_TEMP/swift-protobuf" && swift build -c release --product protoc-gen-swift)
          mkdir -p "$RUNNER_TEMP/tools/bin"
          cp "$RUNNER_TEMP/swift-protobuf/.build/release/protoc-gen-swift" "$RUNNER_TEMP/tools/bin/"
      - name: Add protoc-gen-swift to PATH
        run: echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      # client.proto is a hand copy of the Protocol repo file. The source is CRLF,
      # so its carriage returns are stripped before the comparison.
      - name: Check client.proto against the Protocol repo
        run: |
          curl -sSfL -o "$RUNNER_TEMP/protocol-client.proto" "https://raw.githubusercontent.com/Impulse-m/ImpulseM.Centrifugo.Protocol/$PROTOCOL_COMMIT/definitions/client.proto"
          tr -d '\r' < "$RUNNER_TEMP/protocol-client.proto" | diff - client.proto
      - name: Regenerate client.pb.swift
        run: make proto
      - name: Fail on diff
        run: git diff --exit-code -- Sources/SwiftCentrifuge/client.pb.swift
