name: build
on:
  push:
  pull_request:
  # Called by release.yml. Inside a called workflow, github.event_name is the caller's event.
  workflow_call:
jobs:
  test:
    name: Test
    runs-on: macos-15
    # Prevent duplicate builds on internal PRs. Release runs (workflow_dispatch or
    # workflow_call) always run the tests.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Build
        run: swift build
      # Integration tests need a running Centrifugo (see docker-compose.yml for the
      # equivalent local setup). macOS runners have no Docker, so download the
      # release binary and run it with the same configuration.
      - name: Start Centrifugo
        run: |
          CENTRIFUGO_VERSION=6.8.2
          ARCH=$([ "$(uname -m)" = "x86_64" ] && echo amd64 || echo arm64)
          curl -sL "https://github.com/centrifugal/centrifugo/releases/download/v${CENTRIFUGO_VERSION}/centrifugo_${CENTRIFUGO_VERSION}_darwin_${ARCH}.tar.gz" | tar xz
          CENTRIFUGO_CLIENT_INSECURE=true \
          CENTRIFUGO_LOG_LEVEL=info \
          CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_SIZE=100 \
          CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_TTL=300s \
          CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_FORCE_RECOVERY=true \
          CENTRIFUGO_CHANNEL_NAMESPACES="smallhistory" \
          CENTRIFUGO_CHANNEL_NAMESPACES_SMALLHISTORY_FORCE_RECOVERY=true \
          CENTRIFUGO_CHANNEL_NAMESPACES_SMALLHISTORY_HISTORY_SIZE=2 \
          CENTRIFUGO_CHANNEL_NAMESPACES_SMALLHISTORY_HISTORY_TTL=300s \
          ./centrifugo > centrifugo.log 2>&1 &
      - name: Wait for Centrifugo
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8000/connection/websocket; then
              echo "Centrifugo is up"
              exit 0
            fi
            sleep 1
          done
          echo "Centrifugo did not start in time"
          cat centrifugo.log || true
          exit 1
      # DIAGNOSTIC (temporary, revert before finishing): run each suite alone to find the one that traps.
      - name: Run each suite alone
        continue-on-error: true
        run: |
          set +e
          mkdir -p diag
          : > diag/summary.txt
          for suite in CallWaitTests CodesTests CommandIdCounterTests CompactionTests ConnectionRefreshTests ConnectionTokenTests DeltaFossilTests DeltaPublicationTests FilterTests ForkFieldsSerializerTests GetStateTests IdentityTests InstanceTests LateTimerTests MsgIdGeneratorTests NativeWebSocketTLSChallengeTests PushRoutingTests ReentrancyTests RemoveSubscriptionTests RpcTrackerTests SchedulerSeamTests SerializerTests ServerSubscriptionTests ServerTimeTests StateInvalidationTests StaticTokenTests SubscriptionAttemptTests SubscriptionRefreshTests TransportTests; do
            ./scripts/test.sh --filter "$suite" > "diag/$suite.log" 2>&1
            echo "$suite exit $?" >> diag/summary.txt
          done
          cat diag/summary.txt
      - name: Show suites that trapped
        if: always()
        run: |
          cat diag/summary.txt || true
          for f in diag/*.log; do
            if grep -q "Fatal error\|Unexpectedly\|error: fatalError" "$f"; then
              echo "=== $f"
              grep -n -B2 -A6 "Fatal error\|Unexpectedly\|error: fatalError" "$f" | cut -c1-400 | head -60
            fi
          done
      - name: Run tests
        # Same entry point as local runs; defers to plain `swift test` here
        # because the runner has Xcode. See CLAUDE.md.
        run: ./scripts/test.sh --verbose
      - name: Show Centrifugo log on failure
        if: failure()
        run: cat centrifugo.log || true
